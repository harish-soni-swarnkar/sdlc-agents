name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: JSON validity
        run: for f in $(git ls-files '*.json'); do python3 -m json.tool "$f" > /dev/null; done
      - name: Frontmatter is strict YAML
        run: ./tests/test-frontmatter.sh
      - name: Hook guard tests
        run: ./tests/test-hooks.sh
      - name: Git hook tests
        run: ./tests/test-githooks.sh
      - name: Golden-replay harness test
        run: python3 tests/test-harness.py
      - name: Portable edition is up to date
        run: python3 portable/build.py --check
      - name: Portable edition validates
        run: python3 portable/validate.py

  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The PyPI "skills-ref" package is a stale release without the CLI, so install the
      # validator from the official source, pinned to a commit for reproducible runs.
      - uses: actions/checkout@v7
        with:
          repository: agentskills/agentskills
          ref: 83021e2be457a9b6679148719c1f6074f0ad975e
          path: .skills-ref-src
      - name: Install the official Agent Skills validator
        run: pip install ./.skills-ref-src/skills-ref
      - name: Validate every portable skill
        run: |
          rc=0
          for d in portable/skills/*/; do skills-ref validate "$d" || rc=1; done
          exit $rc

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate . --strict
